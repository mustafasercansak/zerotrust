# Production override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required before first run:
#   1. Place TLS certificates in infra/certs/server.crt and infra/certs/server.key
#      (see scripts/gen-selfsigned-cert.sh for a test cert, or use your real CA cert)
#   2. Place EC private key in secrets/jwt_ec_primary.pem
#      (openssl ecparam -genkey -name prime256v1 -noout | openssl pkcs8 -topk8 -nocrypt > secrets/jwt_ec_primary.pem)
#   3. Set INITIAL_ADMIN_PASSWORD_HASH in .env.admin

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: zerotrust_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      internal:
        ipv4_address: 192.168.200.2

  backend:
    ports: []          # remove direct port exposure — only nginx reaches backend
    restart: unless-stopped
    environment:
      TLS_ENABLED: "false"          # TLS terminated by nginx; backend stays plain HTTP internally
      COOKIES_SECURE: "true"        # browser connects via HTTPS, so Secure flag must be set
      CORS_ALLOWED_ORIGINS: "${PUBLIC_ORIGIN:-https://localhost}"
      JWT_PRIVATE_KEY_FILE: "/run/secrets/jwt_ec_primary"
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-false}"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      PUBLIC_APP_URL: "${PUBLIC_ORIGIN:-https://localhost}"
      TRUSTED_PROXIES: "192.168.200.2/32"
    secrets:
      - jwt_ec_primary
    networks:
      - internal

  frontend:
    ports: []          # same — only nginx is public
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8080"   # rewrites proxy to backend on the internal network
    networks:
      - internal

  postgres:
    ports: []          # never expose DB to the host in production
    networks:
      - internal

  redis:
    ports: []
    networks:
      - internal

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/28

secrets:
  jwt_ec_primary:
    file: ../secrets/jwt_ec_primary.pem
