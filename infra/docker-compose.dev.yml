services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    ports:
      - "8080:8080"
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    environment:
      REGISTRATION_ENABLED: "true"
    develop:
      watch:
        - path: ../backend
          action: sync
          target: /app
          ignore:
            - tmp/
            - "*.pem"
        - path: ../backend/go.mod
          action: rebuild
        - path: ../backend/go.sum
          action: rebuild

  frontend:
    ports:
      - "3000:3000"
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_URL: "http://backend:8080"
    develop:
      watch:
        - path: ../frontend
          action: sync
          target: /app
          ignore:
            - node_modules/
            - dist/
        - path: ../frontend/package.json
          action: rebuild
        - path: ../frontend/package-lock.json
          action: rebuild
