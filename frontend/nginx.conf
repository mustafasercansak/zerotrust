server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and SSE to the backend.
    # SSE: proxy_buffering off is critical — prevents nginx from buffering
    # the event stream and breaking real-time delivery.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE / long-lived connections
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /.well-known/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8080;
    }

    # SPA fallback: every unknown path serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
